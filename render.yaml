# One-click deploy: Render > New > Blueprint > pick this repo.
# Creates a free Postgres database + one web service (API + React) and wires them together.
databases:
  - name: patients-db
    plan: free

services:
  - type: web
    name: patient-admission-app
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patients-db
          property: connectionString
